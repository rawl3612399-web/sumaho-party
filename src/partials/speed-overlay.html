<!-- ===== スピード（テーブル） ===== -->
<div class="speed-table" id="spTable" data-phase="idle" hidden>
  <section class="speed-side speed-top" id="spSide1" aria-label="上側の手元">
    <p class="speed-msg" id="spMsg1"></p>
    <div class="speed-row">
      <div class="speed-slots" id="spSlots1"></div>
      <div class="speed-deck" id="spDeck1"><span class="speed-deck-n" id="spDeckN1"></span></div>
    </div>
    <div class="speed-info"><span class="speed-suit" aria-hidden="true"></span><span class="speed-name" id="spWho1"></span><span class="speed-left" id="spLeft1"></span></div>
  </section>
  <div class="speed-center">
    <div class="speed-pile" id="spPile1" role="button" aria-label="左の台札"></div>
    <div class="speed-mid">
      <p class="speed-call" id="spCall" aria-live="polite"></p>
      <div class="speed-buttons" id="spButtons"></div>
    </div>
    <div class="speed-pile" id="spPile0" role="button" aria-label="右の台札"></div>
  </div>
  <section class="speed-side speed-bottom" id="spSide0" aria-label="下側の手元">
    <p class="speed-msg" id="spMsg0"></p>
    <div class="speed-row">
      <div class="speed-slots" id="spSlots0"></div>
      <div class="speed-deck" id="spDeck0"><span class="speed-deck-n" id="spDeckN0"></span></div>
    </div>
    <div class="speed-info"><span class="speed-suit speed-red" aria-hidden="true"></span><span class="speed-name" id="spWho0"></span><span class="speed-left" id="spLeft0"></span></div>
  </section>
</div>
