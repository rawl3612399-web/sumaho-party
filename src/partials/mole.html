<!-- ===== もぐらたたき ===== -->
<div class="mode" id="modeMole" hidden>
  <main class="stage" aria-live="polite">
    <section class="panel" id="mlSetup">
      <div class="mole-legend" id="mlLegend" aria-label="もぐらの種類">
        <div class="mole-legend-item" data-kind="normal"><span class="mole-legend-art"></span><span class="mole-legend-name">もぐら</span><b class="mole-legend-pts">+1</b></div>
        <div class="mole-legend-item" data-kind="gold"><span class="mole-legend-art"></span><span class="mole-legend-name">金もぐら</span><b class="mole-legend-pts">+5</b></div>
        <div class="mole-legend-item" data-kind="bomb"><span class="mole-legend-art"></span><span class="mole-legend-name">爆弾</span><b class="mole-legend-pts">−3</b></div>
      </div>
      <div class="opts">
        <div class="opt"><span class="row-label">時間</span><div class="chips" id="mlTimeChips"></div></div>
      </div>
      <p class="mole-best" id="mlBest"></p>
      <ul class="rules" id="mlRules"></ul>
    </section>
    <section class="panel" id="mlPlay" hidden>
      <span class="label" id="mlLabel"></span>
      <p class="d-title" id="mlTitle"></p>
      <div class="word-card" id="mlCard"></div>
      <div class="mole-arena" id="mlArena" aria-live="off" hidden>
        <div class="mole-hud" id="mlHud">
          <div class="mole-stat"><span class="mole-stat-label">のこり</span><b class="mole-stat-num" id="mlTime">30</b></div>
          <div class="mole-stat mole-stat-main"><span class="mole-stat-label">スコア</span><b class="mole-stat-num" id="mlScore">0</b></div>
          <div class="mole-stat"><span class="mole-stat-label">コンボ</span><b class="mole-stat-num" id="mlCombo">0</b></div>
        </div>
        <div class="mole-timebar" aria-hidden="true"><span id="mlBar"></span></div>
        <div class="mole-field" id="mlField">
          <div class="mole-board" id="mlBoard"></div>
          <p class="mole-banner" id="mlBanner" aria-hidden="true"></p>
          <div class="mole-pause" id="mlPause" hidden><span>一時停止中</span></div>
        </div>
      </div>
      <ul class="mole-stats" id="mlStats" hidden></ul>
      <p class="hint" id="mlHint"></p>
    </section>
  </main>
  <div class="actions" id="mlActions"></div>
  <template id="mlCritterArt"><svg viewBox="0 -18 100 128" aria-hidden="true">
<g class="mole-g-mole">

</svg></template>
</div>
