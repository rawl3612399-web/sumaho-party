<!-- ===== ブロックおとし (full screen play layer) ===== -->
<div class="blockfall-layer" id="bfLayer" hidden>
  <div class="blockfall-inner">
    <div class="blockfall-top">
      <button class="blockfall-pause-btn" id="bfPause" type="button" aria-label="一時停止">
        <svg class="bars" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
        <svg class="play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
      </button>
      <div class="blockfall-stat wide"><span class="blockfall-cap">スコア</span><b class="blockfall-num" id="bfScore">0</b></div>
      <div class="blockfall-stat"><span class="blockfall-cap">レベル</span><b class="blockfall-num" id="bfLevel">1</b></div>
      <div class="blockfall-stat"><span class="blockfall-cap">ライン</span><b class="blockfall-num" id="bfLines">0</b></div>
    </div>
    <div class="blockfall-board">
      <div class="blockfall-side">
        <span class="blockfall-cap">ホールド</span>
        <div class="blockfall-box"><canvas class="blockfall-mini" id="bfHold" aria-hidden="true"></canvas></div>
        <span class="blockfall-cap">ベスト</span>
        <b class="blockfall-best-num" id="bfBestNum">0</b>
      </div>
      <div class="blockfall-well" id="bfWell">
        <canvas class="blockfall-field" id="bfField" role="img" aria-label="ブロックのフィールド"></canvas>
        <div class="blockfall-callout" id="bfCallout" role="status" aria-live="polite"></div>
        <div class="blockfall-pausebox" id="bfPauseBox" hidden>
          <p class="blockfall-pause-title">一時停止中</p>
          <div class="blockfall-pause-actions" id="bfPauseActions"></div>
        </div>
      </div>
      <div class="blockfall-side">
        <span class="blockfall-cap">ネクスト</span>
        <div class="blockfall-box"><canvas class="blockfall-mini" id="bfNext" aria-hidden="true"></canvas></div>
        <span class="blockfall-cap">つぎまで</span>
        <b class="blockfall-best-num" id="bfToNext">あと10</b>
      </div>
    </div>
    <div class="blockfall-pad" id="bfPad">
      <button class="blockfall-key" type="button" data-act="hold"><span>ホールド</span></button>
      <button class="blockfall-key" type="button" data-act="hard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l5 5 5-5M7 11l5 5 5-5M6 20h12"/></svg><span>ハード</span>
      </button>
      <button class="blockfall-key" type="button" data-act="left" aria-label="左へ">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="blockfall-key" type="button" data-act="soft">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v13M6 12l6 6 6-6"/></svg><span>ソフト</span>
      </button>
      <button class="blockfall-key" type="button" data-act="right" aria-label="右へ">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="blockfall-key rot" type="button" data-act="rotl">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 1 0 2.1-5"/><path d="M5 3v4.5h4.5"/></svg><span>回転 左</span>
      </button>
      <button class="blockfall-key rot" type="button" data-act="rotr">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.1-5"/><path d="M19 3v4.5h-4.5"/></svg><span>回転 右</span>
      </button>
    </div>
  </div>
</div>
